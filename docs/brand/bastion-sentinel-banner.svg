<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050913"/>
      <stop offset="1" stop-color="#0B1530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="accentH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1C3D"/>
      <stop offset="1" stop-color="#070C1C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.6" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E2A4A" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1600" height="900" fill="url(#gridFade)"/></mask>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Emblem: a bastion (fortress shield) with a sentinel eye and keyhole pupil -->
    <g id="emblem">
      <circle cx="470" cy="460" r="330" fill="url(#glow)"/>
      <path d="M330,240 H370 V272 H390 V240 H430 V272 H450 V240 H490 V272 H510 V240 H550 V272 H570 V240 H610 V500 C610,592 545,652 470,694 C395,652 330,592 330,500 Z"
            fill="url(#shieldFill)" stroke="url(#accent)" stroke-width="10" stroke-linejoin="round" filter="url(#soft)"/>
      <path d="M356,300 H584 V498 C584,574 530,624 470,660 C410,624 356,574 356,498 Z"
            fill="none" stroke="#3B82F6" stroke-opacity="0.35" stroke-width="2"/>
      <!-- scan line -->
      <line x1="356" y1="455" x2="584" y2="455" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 8"/>
      <!-- eye -->
      <path d="M378,455 Q470,372 562,455 Q470,538 378,455 Z" fill="#0A1228" stroke="url(#accentH)" stroke-width="7" stroke-linejoin="round"/>
      <circle cx="470" cy="455" r="44" fill="url(#iris)"/>
      <circle cx="470" cy="455" r="44" fill="none" stroke="#A5F3FC" stroke-opacity="0.5" stroke-width="2"/>
      <!-- keyhole pupil -->
      <circle cx="470" cy="444" r="13" fill="#050913"/>
      <path d="M463,448 L477,448 L482,478 L458,478 Z" fill="#050913"/>
      <circle cx="485" cy="436" r="5" fill="#ECFEFF" fill-opacity="0.9"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- circuit traces -->
  <g fill="none" stroke="url(#accentH)" stroke-width="2" stroke-opacity="0.55">
    <path d="M610,360 H660 L690,330 H1520"/>
    <path d="M610,600 H650 L680,630 H1100"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="1520" cy="330" r="5"/>
    <circle cx="1100" cy="630" r="5" fill="#8B5CF6"/>
  </g>

  <use href="#emblem"/>

  <!-- wordmark -->
  <g font-family="'Segoe UI Variable Display','Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">
    <text x="720" y="300" fill="#22D3EE" font-size="30" font-weight="600" letter-spacing="10">TEAM BASTION</text>
    <text x="714" y="452" fill="#F8FAFC" font-size="128" font-weight="800" letter-spacing="2">SENTINEL</text>
    <text x="714" y="578" fill="url(#accentH)" font-size="128" font-weight="800" letter-spacing="2">IAM</text>
    <text x="722" y="672" fill="#94A3B8" font-size="29" font-weight="400">Agentic triage for suspicious logins. Human-approved.</text>
    <text x="722" y="730" fill="#67E8F9" font-size="21" font-weight="600" letter-spacing="7" font-family="'Cascadia Code','Consolas',monospace">PROTECT · DETECT · RESPOND</text>
  </g>

  <!-- footer -->
  <line x1="80" y1="810" x2="1520" y2="810" stroke="#1E2A4A" stroke-width="1"/>
  <text x="80" y="852" fill="#64748B" font-size="20" font-family="'Segoe UI',Arial,sans-serif" letter-spacing="2">IBM SKILLSBUILD AI EXPERIENTIAL LEARNING LAB  ·  BANKING &amp; FINANCIAL SERVICES  ·  FALL 2026</text>
</svg>
