<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050913"/>
      <stop offset="1" stop-color="#0B1530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="accentH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1C3D"/>
      <stop offset="1" stop-color="#070C1C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.6" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E2A4A" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="emblem">
      <circle cx="470" cy="460" r="330" fill="url(#glow)"/>
      <path d="M330,240 H370 V272 H390 V240 H430 V272 H450 V240 H490 V272 H510 V240 H550 V272 H570 V240 H610 V500 C610,592 545,652 470,694 C395,652 330,592 330,500 Z"
            fill="url(#shieldFill)" stroke="url(#accent)" stroke-width="10" stroke-linejoin="round" filter="url(#soft)"/>
      <path d="M356,300 H584 V498 C584,574 530,624 470,660 C410,624 356,574 356,498 Z"
            fill="none" stroke="#3B82F6" stroke-opacity="0.35" stroke-width="2"/>
      <line x1="356" y1="455" x2="584" y2="455" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 8"/>
      <path d="M378,455 Q470,372 562,455 Q470,538 378,455 Z" fill="#0A1228" stroke="url(#accentH)" stroke-width="7" stroke-linejoin="round"/>
      <circle cx="470" cy="455" r="44" fill="url(#iris)"/>
      <circle cx="470" cy="455" r="44" fill="none" stroke="#A5F3FC" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="470" cy="444" r="13" fill="#050913"/>
      <path d="M463,448 L477,448 L482,478 L458,478 Z" fill="#050913"/>
      <circle cx="485" cy="436" r="5" fill="#ECFEFF" fill-opacity="0.9"/>
    </g>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#grid)" opacity="0.6"/>
  <!-- emblem scaled up and centered: emblem center (470,467) -> (512,430) -->
  <use href="#emblem" transform="translate(512 430) scale(1.25) translate(-470 -467)"/>

  <g font-family="'Segoe UI Variable Display','Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <text x="512" y="868" fill="#F8FAFC" font-size="78" font-weight="800" letter-spacing="4">SENTINEL <tspan fill="url(#accentH)">IAM</tspan></text>
    <text x="512" y="930" fill="#22D3EE" font-size="30" font-weight="600" letter-spacing="12">TEAM BASTION</text>
  </g>
</svg>
