<svg width="680" viewBox="0 0 680 556" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Sentinel IAM incident flow</title>
<desc>A suspicious access event enters the Sentinel orchestration layer, where Watchtower reads the live threat picture and Gatekeeper risk-scores the event; Custodian recommends a response; a human analyst approves; then the action is taken and explained.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="80" y="120" width="520" height="200" rx="12" fill="none" stroke="#5F5E5A" stroke-width="0.75" stroke-dasharray="5 4"/>
<text x="92" y="140" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">Sentinel orchestration</text>

<g>
<rect x="240" y="40" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Suspicious access event</text>
<text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">odd login or leak</text>
</g>

<g>
<rect x="104" y="150" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="209" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Watchtower</text>
<text x="209" y="190" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">reads live threat picture</text>
</g>

<g>
<rect x="366" y="150" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="471" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Gatekeeper</text>
<text x="471" y="190" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">risk-scores the event</text>
</g>

<g>
<rect x="235" y="248" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="270" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Custodian</text>
<text x="340" y="288" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">recommends a response</text>
</g>

<g>
<rect x="235" y="362" width="210" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="340" y="384" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Analyst approves</text>
<text x="340" y="402" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">human keeps control</text>
</g>

<g>
<rect x="235" y="462" width="210" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.75"/>
<text x="340" y="484" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#173404">Action taken</text>
<text x="340" y="502" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3B6D11">Sentinel explains why</text>
</g>

<line x1="315" y1="96" x2="216" y2="147" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="365" y1="96" x2="464" y2="147" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="216" y1="206" x2="318" y2="245" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="464" y1="206" x2="362" y2="245" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="306" x2="340" y2="359" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="420" x2="340" y2="459" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
